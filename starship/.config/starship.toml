"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands executed by starship (ms)
command_timeout = 5000

# Timeout for starship to scan files (in milliseconds).
scan_timeout = 5000

# Disable the blank line at the start of the prompt
# add_newline = false

format = """
[](#3B4252)\
[$os ](bg:#3B4252 fg:#090c0c)\
$python\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](fg:#434C5E bg:#4C566A)\
$git_branch\
$git_commit\
$git_status\
[](fg:#4C566A bg:#037275)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:#037275 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""

right_format = """
$cmd_duration
"""

# Replace the "❯" symbol in the prompt with "➜"
# [character]
# success_symbol = "[   ](bold fg:blue)"
# error_symbol = "[   ](bold fg:red)"

[os]
format = "[$symbol]($style)"
style = "bg:#3B4252 fg:#ffffff"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Fedora = "󰣛"
Debian = "󰣚"
Android = ""
Arch = "󰣇"
Linux = "󰌽"
Mint = "󰣭"
Kali = ""
Macos = "󰀵"

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:#3B4252"
style_root = "bg:#3b2a2a"
format = '[$user ]($style)'

[hostname]
ssh_only = false
style = "bg:#3B4252"
format = "[@$hostname ]($style)"
disabled = false

[directory]
style = "bg:#434C5E"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ''
read_only_style = "bg:#434C5E"

[git_branch]
symbol = "󰘬"
style = "bg:#4C566A"
format = '[ $symbol $branch(:$remote_branch) ]($style)'

[git_commit]
style = "bg:#4C566A"
commit_hash_length = 7
tag_symbol = " "
only_detached = true
format = "[$hash$tag]($style)"
disabled = false

[git_status]
style = "bg:#4C566A"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:#3B4252"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = ""
style = "bg:#037275"
format = '[ $symbol ($version) ]($style)'


[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style) $path'


[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = '[ $time ]($style)'

[cmd_duration]
min_time = 500
format = '[](bold fg:yellow)[󰪢 $duration](bold bg:yellow fg:black)[](bold fg:yellow)'

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"