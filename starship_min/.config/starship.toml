"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands executed by starship (ms)
command_timeout = 2000

# Timeout for starship to scan files (in milliseconds).
scan_timeout = 5000

# newline between commands
add_newline = true

# ! opt-in for individual modules (e.g., aws, docker, gcloud, nodejs, python)
# standalone format to get os glyph on ps1 line,
# prompt character below
format = """
$os$username$hostname: $directory$git_branch$git_status$git_commit\
$fill\
$python$c$golang$java$nodejs$rust$docker_context$cmd_duration
$character
"""

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[os]
format = '[$symbol](bold white)'
disabled = false

[os.symbols]
Fedora = "󰣛 "
Kali = "  "
Alpine = " "
Arch = " "
Debian = " "
Ubuntu = " "
NixOS = " "
Pop = " "
Mint = "󰣭 "
Linux = " "
Macos = "󰀵 "
Windows = "󰍲 "
Android = " "
Unknown = " "

[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](green bold)"
disabled = false

# truncation length works backwards (i.e., cwd > parent > parent ...)
[directory]
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ' '

[git_branch]
truncation_length = 25
truncation_symbol = ''

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](green)'

[git_commit]
commit_hash_length = 4

[env_var.SHELL]
variable = "SHELL"
default = "unknown shell"
disabled = true

[fill]
symbol = ' '

[cmd_duration]
min_time = 500
format = '[$duration](bold yellow)'
