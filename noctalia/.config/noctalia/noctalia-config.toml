[backdrop]
enabled = true

[bar]
order = [ "Top" ]

    [bar.Top]
    center = [ "group:g4", "group:g3" ]
    end = [
        "privacy",
        "tray",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "clock",
        "session"
    ]
    margin_edge = 0
    margin_ends = 0
    radius = 0
    shadow = false
    start = [ "control-center", "launcher", "workspaces", "active_window" ]
    thickness = 28

        [[bar.Top.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "audio_visualizer", "media" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Top.capsule_group]]
        fill = "on_primary"
        id = "g2"
        members = [ "session", "clock" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Top.capsule_group]]
        fill = "surface_variant"
        id = "g3"
        members = [ "media" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Top.capsule_group]]
        fill = "surface_variant"
        id = "g4"
        members = [ "cpu", "temp", "ram", "network_rx", "network_tx" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 25

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000007",
    "desktop-widget-0000000000000008",
    "desktop-widget-0000000000000009"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 128.0
    box_width = 384.0
    cx = 960.0
    cy = 284.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        clock_style = "digital"
        format = ""

    [desktop_widgets.widget.desktop-widget-0000000000000007]
    box_height = 128.0
    box_width = 320.0
    cx = 1120.0
    cy = 988.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000007.settings]
        background = true
        background_opacity = 0.20000000000000001
        background_padding = 10
        background_radius = 0
        hide_when_no_media = true
        layout = "horizontal"

    [desktop_widgets.widget.desktop-widget-0000000000000008]
    box_height = 256.0
    box_width = 384.0
    cx = 960.0
    cy = 284.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000008.settings]
        background = false
        clock_style = "analog"
        format = "{:%-I:%M}"

    [desktop_widgets.widget.desktop-widget-0000000000000009]
    box_height = 128.0
    box_width = 320.0
    cx = 800.0
    cy = 988.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000009.settings]
        background = true
        background_opacity = 0.20000000000000001
        background_radius = 0
        bands = 32
        mirrored = true
        show_when_idle = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300

[location]
address = "Kozhikode, India"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 448.0
    cx = 960.0
    cy = 300.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "surface"
        clock_style = "digital"
        format = "{:%H:%M}"

[nightlight]
enabled = true

[osd]
position = "top_right"

[plugins]
enabled = []

[shell]
avatar_path = "/mnt/Nahil/Media/gal/cropped_image.png"
clipboard_auto_paste = "ctrl_v"
font_family = "Red Hat Text"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
screen_time_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.panel]
    clipboard_placement = "floating"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    shadow = false

[theme]
builtin = "Gruvbox"
community_palette = "Flexoki"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "obsidian", "yazi" ]

[wallpaper]
directory = "/mnt/Nahil/Media/wallpaper"
transition_on_startup = true

    [wallpaper.default]
    path = "/mnt/Nahil/Media/wallpaper/wp8113328-minimalist-8k-wallpapers.jpg"

    [wallpaper.last]
    path = "/mnt/Nahil/Media/wallpaper/wp8113328-minimalist-8k-wallpapers.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/mnt/Nahil/Media/wallpaper/wp8113328-minimalist-8k-wallpapers.jpg"

[weather]
refresh_minutes = 60

[widget.Memory]
stat = "ram_used"
type = "sysmon"

[widget.audio_visualizer]
show_when_idle = true

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.brightness]
show_label = false

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%l:%M %p, %a %e %b}"
tooltip_format = "{:%-I:%M %p \\n%A, %e %B %Y}"

[widget.cpu]
display = "text"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.network_rx]
display = "text"

[widget.network_tx]
display = "text"

[widget.ram]
display = "text"

[widget.sysmon]
display = "text"

[widget.temp]
display = "text"

[widget.volume]
show_label = false
