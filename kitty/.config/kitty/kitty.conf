# Scrollback
scrollback_lines 10000

# Window Configuration
window_padding_width 5
window_margin_width 1
background_opacity 0.90
background_blur 1
hide_window_decorations yes

linux_display_server auto

# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11

# Cursor
cursor_shape beam
cursor_blink_interval 1
cursor_trail 1

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left

tab_activity_symbol             " ● "
tab_title_template              "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template       "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# Keybindings
map kitty_mod+equal  change_font_size all +1
map kitty_mod+plus   change_font_size all +1
map kitty_mod+kp_add change_font_size all +1

map kitty_mod+minus       change_font_size all -1
map kitty_mod+underscore       change_font_size all -1
map kitty_mod+kp_subtract change_font_size all -1

map kitty_mod+0 change_font_size all 0

# Search
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Standard "copy" button when text is selected, but "interrupt" (SIGINT) when no text is selected. 
map ctrl+c    copy_or_interrupt

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# No stupid close confirmation
confirm_os_window_close 0

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

enable_audio_bell no
shell_integration enabled

include current-theme.conf
include themes/noctalia.conf
